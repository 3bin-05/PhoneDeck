[package]
name = "agent"
version = "0.1.0"
description = "Phone Deck Agent Desktop Application"
authors = ["Phone Deck"]
edition = "2021"

[lib]
name = "agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
protocol = { path = "../../../crates/protocol" }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = ["tray-icon", "custom-protocol", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = { version = "0.13", features = ["pem", "ring"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
mdns-sd = "0.13"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
futures-util = "0.3"
hex = "0.4"
ring = "0.17"
sysinfo = "0.33"
notify = "6.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Media_Control",
    "Foundation",
    "Foundation_Collections",
    "Storage_Streams",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_Media_Audio",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
] }
image = { version = "0.25", default-features = false, features = ["webp", "png", "jpeg"] }

[dev-dependencies]
tokio-tungstenite = "0.26"
