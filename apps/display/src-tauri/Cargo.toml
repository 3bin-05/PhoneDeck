[package]
name = "display"
version = "0.1.0"
description = "Phone Deck Display Android Dashboard Application"
authors = ["Phone Deck"]
edition = "2021"

[lib]
name = "display_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
protocol = { path = "../../../crates/protocol" }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = ["custom-protocol"] }
tauri-plugin-log = "2"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-pki-types", "tokio-rustls"] }
futures-util = "0.3"
hex = "0.4"
mdns-sd = "0.13"
