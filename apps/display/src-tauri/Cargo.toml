[package]
name = "display"
version = "0.1.0"
description = "Phone Deck Display Android Dashboard Application"
authors = ["Phone Deck"]
edition = "2021"

[lib]
name = "display_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
protocol = { path = "../../../crates/protocol" }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
