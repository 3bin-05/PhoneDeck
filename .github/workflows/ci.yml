name: CI & Packaging Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test-and-budgets:
    name: Tests & Budget Enforcement
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12.21.0

      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Frontends
        run: pnpm -r build

      - name: Run Workspace Tests
        run: cargo test --workspace

      - name: Run Section 10 Budget Checks (deck-sim)
        run: |
          $mock = Start-Process -FilePath "cargo" -ArgumentList "run -p deck-mock" -PassThru
          Start-Sleep -Seconds 4
          try {
            cargo run -p deck-sim -- --duration 2
          } finally {
            Stop-Process -Id $mock.Id -Force -ErrorAction SilentlyContinue
          }

  build-windows-agent:
    name: Build Windows Agent Installer
    runs-on: windows-latest
    needs: test-and-budgets
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12.21.0

      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Frontends
        run: pnpm -r build

      - name: Build Windows Tauri Agent Installer (NSIS)
        run: pnpm --filter @phone-deck/agent tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: phone-deck-agent-installer
          path: target/release/bundle/nsis/*.exe

  build-android-apk:
    name: Build Android APK (arm64-v8a + armeabi-v7a)
    runs-on: ubuntu-latest
    needs: test-and-budgets
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK Platform & NDK
        run: |
          ANDROID_SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_SDK" >> $GITHUB_ENV
          yes | $ANDROID_SDK/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_SDK/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;26.1.10909125"
          NDK_PATH="$ANDROID_SDK/ndk/26.1.10909125"
          echo "NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12.21.0

      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Make Gradle Wrapper Executable
        run: chmod +x apps/display/src-tauri/gen/android/gradlew

      - name: Build Display Frontend
        run: pnpm -r build

      - name: Build Android Release APK
        run: |
          pnpm --filter @phone-deck/display tauri android build --apk --target aarch64 --target armv7

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: phone-deck-display-apk
          path: apps/display/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
