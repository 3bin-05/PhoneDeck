[package]
name = "deck-mock"
version = "0.1.0"
edition = "2021"
description = "Mock Phone Deck Agent serving simulated telemetry for UI development"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
futures-util = "0.3.34"
protocol = { path = "../protocol" }
rmp-serde = "1.3.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
hex = "0.4"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors"] }

[[bin]]
name = "deck-mock"
path = "src/main.rs"
