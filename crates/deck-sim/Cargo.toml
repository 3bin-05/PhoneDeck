[package]
name = "deck-sim"
version = "0.1.0"
edition = "2021"
description = "Headless Phone Deck simulator to enforce telemetry and performance budgets in CI"

[dependencies]
protocol = { path = "../protocol" }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
sysinfo = "0.33"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bin]]
name = "deck-sim"
path = "src/main.rs"
