[package]
name = "protocol"
version = "0.1.0"
edition = "2021"
description = "Shared protocol definitions, field dictionary, and serialization for Phone Deck"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
rmp-serde = "1.3"
ts-rs = "12.0.1"

[lib]
name = "protocol"
path = "src/lib.rs"

[dev-dependencies]
proptest = "1.12.0"
