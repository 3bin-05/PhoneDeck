[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/deck-cli",
    "crates/deck-mock",
    "crates/deck-sim",
    "apps/agent/src-tauri",
    "apps/display/src-tauri",
]

# Section 10 Item 24 release profile
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
